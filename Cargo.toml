[package]
name = "penguin_harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Linux desktop automation harness for Codex"
readme = "README.md"
license = "Apache-2.0"

[[bin]]
name = "penguin-harness"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ashpd = { version = "0.13.7", default-features = false, features = ["tokio", "screenshot"] }
lamco-portal = "0.4.1"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "time"] }
url = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }
x11rb = { version = "0.13.2", features = ["image", "xtest"] }
